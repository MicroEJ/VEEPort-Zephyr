CONFIG_MICROEJ_FS_BACKEND_FATFS=y
CONFIG_MICROEJ_FS_MNT_POINT="/SD:"
CONFIG_MICROEJ_KF_KERNEL_WORKING_BUFFER_SIZE=0x1000
CONFIG_MICROEJ_FS_IO_BUFFER_SIZE=8192

# No device Random Generator
CONFIG_TEST_RANDOM_GENERATOR=y

# Network buffer tuning
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=4096
CONFIG_NET_BUF_DATA_SIZE=800
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24

CONFIG_MICROEJ_BLUETOOTH=n
CONFIG_MICROEJ_SERIAL=n
