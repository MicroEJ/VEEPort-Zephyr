CONFIG_MICROEJ_FS_BACKEND_FATFS=y
CONFIG_MICROEJ_FS_MNT_POINT="/SD:"
CONFIG_MICROEJ_FS_IO_BUFFER_SIZE=32768

CONFIG_MICROEJ_KF_KERNEL_WORKING_BUFFER_SIZE=0xF0000

# Ethernet support disabled when using nxp,enet1g.overlay
# see https://github.com/zephyrproject-rtos/zephyr/issues/100110
CONFIG_NET_L2_ETHERNET=y

# Network buffer tuning
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=16384
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32

# Set maximum size for SSL content length
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384

# Serial configuration
CONFIG_MICROEJ_SERIAL_NOCACHE_BUFFERS=y
CONFIG_MICROEJ_SERIAL_ENABLE_PORT_1=n
CONFIG_MICROEJ_SERIAL_RX_BUFFER_NUMBER=2

CONFIG_MICROEJ_BLUETOOTH=n
