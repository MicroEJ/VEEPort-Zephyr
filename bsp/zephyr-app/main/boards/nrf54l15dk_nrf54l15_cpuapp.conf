# Build: 7E4D1F7C

CONFIG_MICROEJ_FS_BACKEND_LITTLEFS=y
CONFIG_MICROEJ_FS_MNT_POINT="/lfs"
CONFIG_MICROEJ_FS_IO_BUFFER_SIZE=2048
CONFIG_FS_LITTLEFS_PROG_SIZE=512
CONFIG_FS_LITTLEFS_CACHE_SIZE=1024
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=256
CONFIG_MICROEJ_FS_WORKER_JOB_COUNT=2

CONFIG_MICROEJ_KF_KERNEL_WORKING_BUFFER_SIZE=0x1000

CONFIG_MICROEJ_MICROAI=n
CONFIG_MICROEJ_NET=n
CONFIG_MICROEJ_SSL=n
CONFIG_UARTE_NRFX_UARTE_COUNT_BYTES_WITH_TIMER=y

# BLE thread stack sizing (overrides port/bluetooth/Kconfig defaults).
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Bluetooth (BT_SMP) implies the p256-m PSA driver, which accelerates secp256r1 only. With both
# Bluetooth and Crypto enabled, the Crypto layer needs more ECC curves than secp256r1, and Mbed
# TLS rejects "partial ECC curve acceleration" while the classic PK layer is on. Disable the driver so
# all ECC runs in software (an imply can only be overridden by an explicit assignment like this one).
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=n
