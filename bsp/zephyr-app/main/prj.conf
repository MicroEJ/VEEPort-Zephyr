# Build: 7E4D1F7C
CONFIG_MAIN_STACK_SIZE=8192
# MicroEJ task priority layout (all preemptible, mirrors the reference VEE Ports):
#   1 net AsyncSelect > 2 FS workers > 3 VM (main thread) > 4 Security worker.
# IO-bound workers must preempt the VM or a CPU-bound Java thread starves them;
# the CPU-bound Security worker stays below the VM.
CONFIG_MAIN_THREAD_PRIORITY=3
CONFIG_FPU=y
CONFIG_SERIAL=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_CONSOLE=y
CONFIG_ARM_MPU=y
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_UART_CONSOLE=y
CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y
CONFIG_XSI_STREAMS=y
CONFIG_SPEED_OPTIMIZATIONS=y
