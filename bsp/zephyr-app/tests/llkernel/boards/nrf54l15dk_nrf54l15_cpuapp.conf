# The nRF54L15 has 256 KiB of RAM. The default 0xF0000 (960 KiB) working buffer overflows it.
# The tests allocate at most 6 features of 0x100 bytes of ROM and 0x100 bytes of RAM each.
CONFIG_MICROEJ_KF_KERNEL_WORKING_BUFFER_SIZE=0x4000
