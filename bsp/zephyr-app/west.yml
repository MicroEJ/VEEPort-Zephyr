manifest:
  version: "1.0"

  defaults:
    remote: github

  remotes:
    - name: github
      url-base: https://github.com/zephyrproject-rtos
    - name: eembc
      url-base: https://github.com/eembc
    - name: microej
      url-base: https://github.com/MicroEJ

  group-filter: [+optional]

  projects:
    # OS- and hardware-independent C sources shared by every MicroEJ VEE Port:
    # VEE main entry point, standard output, logger, error helpers and memory pool.
    - name: abstraction-layer-essentials
      remote: microej
      repo-path: AbstractionLayer-Essentials
      path: zephyr-app/vee/port/essentials
      revision: 1.1.0

    - name: zephyr
      revision: v4.4.2
      west-commands: scripts/west-commands.yml

    # Modules declared explicitly with revisions from Zephyr v4.4.2's manifest.
    # Revisions come from bsp/zephyr/west.yml and bsp/zephyr/submanifests/optional.yaml.
    # Needed to package bsp folder inside the VEE Port module that excludes .git/ folders 
    # containing manifest-rev file when using import west manifest feature.
    - name: cmsis
      path: modules/hal/cmsis
      revision: 512cc7e895e8491696b61f7ba8066b4a182569b8
    - name: cmsis-dsp
      path: modules/lib/cmsis-dsp
      revision: 97512610ec92058f0119450b9e743eeb7e95b5c8
    - name: cmsis-nn
      path: modules/lib/cmsis-nn
      revision: d20117c9e88cf9018d6fa06744dddac700c3e3a1
    - name: cmsis_6
      path: modules/hal/cmsis_6
      revision: 30a859f44ef8ab4dc8f84b03ed586fd16ccf9d74
    - name: hal_nordic
      path: modules/hal/nordic
      revision: 44fd3d44b15cb75f80a25b4679f91d2787e28664
    - name: hal_nxp
      path: modules/hal/nxp
      revision: 7554bc0f6f6c284972eba7b2c17b16fbb9cc0ad0
    - name: fatfs
      path: modules/fs/fatfs
      revision: f4ead3bf4a6dab3a07d7b5f5315795c073db568d
    - name: littlefs
      path: modules/fs/littlefs
      revision: 8f5ca347843363882619d8f96c00d8dbd88a8e79
    - name: mbedtls
      path: modules/crypto/mbedtls
      revision: a3e190fe44c78d1ba67f55979e1257328cc7d0d8
    - name: tf-psa-crypto
      path: modules/crypto/tf-psa-crypto
      revision: dc575a2ddcc8cb16275d24c42a52eaf79ebe2231
    - name: segger
      path: modules/debug/segger
      revision: 50892fdbcf2f570e67baa72b8894a66b16946f72
    - name: tflite-micro
      path: optional/modules/lib/tflite-micro
      revision: fcc760af130f3a595b5802cdebcc77461e54f382
      groups:
        - optional

  self:
    path: bsp/zephyr-app
