patches:
  - path: zephyr/fix-posix-sa-family-t-without-net.patch
    sha256sum: b3682faf853ac412b6747a35f1052e5d0164dc7536dc59d95a8e3b25e4306a03
    module: zephyr
    author: MicroEJ
    email: support@microej.com
    date: 2026-09-04
    comments: |
      Define sa_family_t in <sys/socket.h> when the networking stack is off. Since the 4.4 network API
      namespacing, the POSIX <arpa/inet.h> (pulled in by Mbed TLS x509_crt.c) uses sa_family_t, which
      only exists through net_compat.h when CONFIG_NETWORKING is set. Breaks CONFIG_POSIX_API builds
      with Mbed TLS X.509 and no networking (nrf54l15).
