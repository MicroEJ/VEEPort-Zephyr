[versions]
microej-sdk = "1.6.0"

[libraries]
# APIs
api-bluetooth =         { group = "ej.api", name = "bluetooth", version = "2.4.0" }
api-bon =               { group = "ej.api", name = "bon", version = "1.4.3" }
api-device =            { group = "ej.api", name = "device", version = "1.4.0" }
api-edc =               { group = "ej.api", name = "edc", version = "1.3.7" }
api-event =             { group = "ej.api", name = "event", version = "3.0.3" }
api-fs =                { group = "ej.api", name = "fs", version = "2.1.1" }
api-microai =           { group = "ej.api", name = "microai", version = "2.2.0" }
api-net =               { group = "ej.api", name = "net", version = "1.1.4" }
api-security =          { group = "ej.api", name = "security", version = "1.7.0" }
api-serial =            { group = "ej.api", name = "serial", version = "3.0.0" }
api-ssl =               { group = "ej.api", name = "ssl", version = "2.2.3" }

# Architecture
architecture = { group = "com.microej.architecture.CM7.CM7hardfp_GCC48", name = "flopi7G26", version = "8.6.0" }

# Packs
#pack-ecom-network =     { group = "com.microej.pack.ecom-network", name = "ecom-network-pack", version = "1.0.0" }
pack-fs =               { group = "com.microej.pack", name = "fs", version = "6.0.4" }
pack-net =              { group = "com.microej.pack.net", name = "net-pack", version = "13.0.0" }
pack-serial =           { group = "com.microej.pack.serial", name = "serial-pack", version = "3.0.0" }

# Libraries
library-logging =       { group = "ej.library.eclasspath", name = "logging", version = "1.2.1" }
frontpanel-framework =  { group = "ej.tool.frontpanel", name = "framework", version = "1.1.0" }

# Test Libraries
junit =             { group = "ej.library.test", name = "junit", version = "1.12.0" }
junit-platform =    { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.8.2" }
jenkins =           { group = "com.microej.deploy", name = "jenkins", version = "1.1.1"}

# Testsuites
testsuite-event =               { group = "com.microej.pack.event", name = "event-testsuite", version = "3.0.1" }
testsuite-fs =                  { group = "com.microej.pack.fs", name = "fs-testsuite", version = "3.0.8" }
testsuite-fs-openjdk =          { group = "com.microej.pack.fs", name = "fs-testsuite-openjdk", version = "1.0.1" }
testsuite-security =            { group = "com.microej.pack.net", name = "security-1_8-testsuite", version = "1.10.0" }
testsuite-net =                 { group = "com.microej.pack.net", name = "net-1_1-testsuite", version = "4.1.1" }
testsuite-net-openjdk =         { group = "com.microej.pack.net", name = "net-1_1-testsuite-openjdk", version = "1.1.1" }
testsuite-serial =              { group = "com.microej.pack.serial", name = "serial-testsuite", version = "1.1.0" }
testsuite-ssl =                 { group = "com.microej.pack.net", name = "net-ssl-2_2-testsuite", version = "5.0.1" }
testsuite-ssl-openjdk =         { group = "com.microej.pack.net", name = "net-ssl-2_2-testsuite-openjdk", version = "2.0.1" }

