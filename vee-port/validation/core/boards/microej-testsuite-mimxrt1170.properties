# Per-board overlay for mimxrt1170: overrides validation/microej-testsuite-common.properties.
# These are the ArrayCopyPerformance thresholds for the MIMXRT1170-EVK. The four figures depend on
# the memory that holds the Java heap, so they hold for this board only. Measure the baseline again
# on another board before you add its overlay. An unset option defaults to 0, which makes its check
# a no-op.
#
# Baseline measured on the MIMXRT1170-EVK, with the default 64 KB buffers, over ten runs:
#   aligned         97 to 99 MB/s
#   misaligned      91 to 92 MB/s
#   overlap left    127 to 143 MB/s   (two modes, see below)
#   overlap right   136 to 143 MB/s
# Each threshold is the lowest value observed for that copy, minus 10%.
#
# The two overlapping copies are faster because they move two thirds of the memory traffic, not
# because memmove takes a better path for them. See the traffic count further down. Each destination
# byte lands in the cache line that the read of the same line just filled, so the write hits and the
# allocate read of the destination disappears.
#
# The linked memmove is the newlib generic one. It uses its fast path, a 16-byte unrolled word loop,
# only when the destination is at or below the source, the two regions do not overlap, the length is
# above 15, and both addresses are word-aligned. The four figures therefore run these paths:
#   aligned         forward word loop                                        97 to  99 MB/s
#   misaligned      forward byte loop (the destination is at +1)             91 to  92 MB/s
#   overlap left    forward byte loop (the source is at +1)                 127 to 143 MB/s
#   overlap right   backward byte loop (always byte-wise)                   136 to 143 MB/s
# The only case on the word path is the slowest one. Every case needs 6.5 cycles or more for each
# byte on the 1 GHz core, where a byte loop that hits the cache needs about 2 to 3. All four are
# therefore bound by the memory, and the width of the loop does not change the result.
#
# UNEXPLAINED, two observations on the overlapping copies.
#
# First, overlap left has two modes and nothing between them. Over ten runs it gave 127 or 128 MB/s
# four times, and 142 or 143 MB/s six times. The spread inside each mode is 1 MB/s, and the gap
# between the modes is 12%. A run keeps its mode for its whole measurement. The cause is not
# identified. The buffers are the first heap allocations, so a likely candidate is the alignment of
# the buffer against the 32-byte cache line, which moves with the heap start address. To confirm it,
# print the two buffer addresses for each run and correlate them with the mode.
#
# Second, the order of the two overlapping figures is not stable across configurations of this port.
# An earlier measurement of this same board gave overlap right 152 to 155 MB/s and overlap left 117
# to 119 MB/s, which is the opposite order. The threshold of each overlapping copy is therefore the
# most likely to move after an unrelated change to the copy routine or to the memory configuration.
# Re-measure both after such a change instead of trusting these values.
#
# The thresholds are regression floors only: they say nothing about whether the port reaches the
# hardware's potential. The measured throughputs must also be compared against the theoretical memory
# bandwidth the silicon vendor advertises for the backing memory (the RAM bandwidth figures in the
# datasheet or reference manual) to confirm the port reaches the expected fraction of peak.
#
# Compared against the peak of this board: the Java heap is in the external SDRAM at 0x80000000,
# because the board devicetree gives zephyr,sram = &sdram0. The EVK carries two Winbond W9825G6KH-5I
# devices as one 32-bit port, and the board DCD sets the SEMC, which Zephyr does not change
# (SEMC_SDRAMCR0 = 0xF32). At the 198 MHz SEMC clock root the peak is therefore 792 MB/s.
#
# The SDRAM is mapped write-back with read and write allocate (REGION_RAM_ATTR on the SRAM_0 MPU
# region, in the i.MX RT SoC), so a copy between the two buffers costs three transfers for each byte:
# the read of the source, the allocate read of the destination line, and the later write back of that
# line. An overlapping copy costs two transfers for each byte instead of three, because the write
# hits the line that the read just filled. Its ceiling is therefore 3/2 of the ceiling of a copy
# between two buffers. This holds although a 64 KB buffer still exceeds the 32 KB L1 data cache: the
# reuse happens inside the copy, not between two iterations of it.
#
# The four figures therefore put this much traffic on the bus, against the 792 MB/s peak:
#   aligned         97 MB/s x 3   = 291 MB/s    37% of peak
#   misaligned      91 MB/s x 3   = 273 MB/s    34% of peak
#   overlap left   127 MB/s x 2   = 254 MB/s    32% of peak   (low mode)
#                  142 MB/s x 2   = 284 MB/s    36% of peak   (high mode)
#   overlap right  136 MB/s x 2   = 272 MB/s    34% of peak
# Every case sits between 32% and 37% of peak, so no case reaches the memory ceiling.
#
# To raise these figures, examine the copy routine before the cache policy. Three of the four cases
# never reach the word path of the newlib memmove, and the aligned case that does reach it is already
# bound by the memory. The nxpvee port of the same board reaches 131 MB/s aligned with a word-wide
# memmove of its own, under a write-through mapping that costs two transfers for each byte.
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.mbps=87
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.misaligned.mbps=81
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.right.mbps=122
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.left.mbps=114
