# Build: 7E4D1F7C

# Per-board overlay for nrf54l15: overrides validation/microej-testsuite-common.properties.

# Java memory settings. The Java heap of this board is in the on-chip SRAM. The Zephyr RAM region of
# nrf54l15dk/nrf54l15/cpuapp is 188 KB, and the rest of the build needs about 104 KB of it, so about
# 84 KB is available for the heap. The 160 KB heap of validation/microej-testsuite-common.properties
# overflows the region by 77528 bytes. 64 KB holds the two ArrayCopyPerformance buffers below and the
# test framework, and keeps about 20 KB free.
core.memory.javaheap.size=65536
core.memory.javaheapsum.size=65536

# ArrayCopyPerformance uses two buffers of 16 KB, not the default 64 KB, because the heap above holds
# no more. A figure measured with this buffer size is therefore not comparable with a figure measured
# on a board that keeps the default, nor with the FRDM-MCXN947 figures, which use 32 KB buffers.
microej.java.property.com.microej.core.tests.arraycopy.buffer.size.bytes=16384

# Baseline measured on the nRF54L15 DK, with the 16 KB buffers above and the picolibc of Zephyr SDK
# 1.0.1 (Zephyr 4.4), over three runs:
#   aligned        139 MB/s
#   misaligned      56 MB/s
#   overlap right   21 MB/s
#   overlap left    72 MB/s
# The runs gave these same four values, with no spread. Each threshold is the lowest value observed
# for that copy, minus 10%.
#
# The three forward copies are 3 to 7 times faster than the backward one, because the picolibc memmove
# picks its loop from the copy direction and the alignment, as read from the disassembly of this build
# (the same memmove object as on the FRDM-MCXN947). A forward copy (the destination at or below the
# source) uses a word loop whatever the alignment, because the Cortex-M33 loads and stores unaligned
# words, and the aligned case gets a 16-byte unrolled variant of it. A backward copy (the destination
# above the source, overlapping) uses a word loop only when both buffer ends are word aligned, and a
# byte loop otherwise.
# The four figures therefore run these paths:
#   aligned         forward 16-byte unrolled word loop            139 MB/s
#   misaligned      forward word loop (the destination is at +1)   56 MB/s
#   overlap left    forward word loop (the source is at +1)        72 MB/s
#   overlap right   backward byte loop (the ends are misaligned)   21 MB/s
#
# The copy is bound by the core, not by the memory. The Java heap is in the on-chip SRAM at
# 0x20000000, the core runs at 128 MHz (the hfpll clock of the cpu node in the devicetree), and this
# build enables no data cache (CONFIG_DCACHE is not set). The word paths cost about 0.9 to 2.3 cycles
# for each byte, and the byte loop about 6.1 cycles, which is the cost of the loop itself. No figure
# depends on the buffer size, so the 16 KB buffers measure this port as well as larger buffers.
#
# To raise the overlap-right figure, give the port a memmove whose backward path copies words when
# the ends are misaligned, as the forward path already does.
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.mbps=125
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.misaligned.mbps=50
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.right.mbps=18
microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.left.mbps=64
