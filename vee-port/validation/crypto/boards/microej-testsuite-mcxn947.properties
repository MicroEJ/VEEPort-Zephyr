# Per-board overlay for mcxn947-frdm: overrides validation/microej-testsuite-common.properties.
# RSA keygen of 3072+ bits on the mcxn947-frdm (Cortex-M33 @150MHz) exceeds the 120s trace-inactivity timeout.
# Both RSA tests generate a key per listed size.
microej.java.property.com.microej.crypto.test.cipher.rsa.keysizes=1024,2048
microej.java.property.com.microej.crypto.test.keypairgen.rsa.keysizes=1024,2048
