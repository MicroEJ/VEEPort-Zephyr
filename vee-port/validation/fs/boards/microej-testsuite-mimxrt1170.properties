# Build: 7E4D1F7C

# Per-board overlay for mimxrt1170: overrides validation/microej-testsuite-common.properties.

# The cleaner is disabled on this board. It lists /usr and /tmp with File.listFiles(), which holds the
# whole listing in the Java heap, so a directory of a few hundred files is enough to throw an
# OutOfMemoryError before the test starts. The SD card of the CI board is shared with other projects
# that leave files behind, so the directory size is out of our control. Enable it again once the
# temporary files are removed without the Java heap, for example by a wipe at mount.
#
# Without the cleaner, the leftovers build up and slow down the directory lookups: wipe the SD card
# when the tests start timing out.
microej.java.property.clean.fs.before.tests=false
